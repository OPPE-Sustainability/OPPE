name: Hourly Air Quality Sync

on:
  schedule:
    - cron: '0 * * * *' # สั่งรันอัตโนมัติทุกต้นชั่วโมง 24 ชม.
  workflow_dispatch:   # ปุ่มกดสั่งรันด้วยมือเพื่อทดสอบ

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Sync Script
        run: python sync.py