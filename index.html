<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานคุณภาพอากาศและ EHS ม.มหิดล</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- จุดแทรกชิ้นส่วน UI แต่ละก้อน -->
    <div id="view-header"></div>
    <div id="view-aqi"></div>
    <div id="view-ehs"></div>
  </div>

  <!-- จุดแทรก Modal ด้านนอก Container -->
  <div id="view-light-modal"></div>

  <!-- ตัวโหลดคอมโพเนนต์ -->
  <script>
    async function loadComponent(elementId, filePath) {
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`HTTP ${res.status} on ${filePath}`);
        const html = await res.text();
        document.getElementById(elementId).innerHTML = html;
      } catch (e) {
        console.error("Load component error:", e);
      }
    }

    async function initApp() {
      await Promise.all([
        loadComponent('view-header', 'components/header.html'),
        loadComponent('view-aqi', 'components/aqi-summary.html'),
        loadComponent('view-ehs', 'components/ehs-hub.html'),
        loadComponent('view-light-modal', 'components/light-modal.html')
      ]);

      const scripts = [
        'js/carousel.js',
        'js/aqi-chart.js',
        'js/push-notify.js',
        'js/light-data.js'
      ];

      for (const src of scripts) {
        await new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => {
            console.error(`Failed to load ${src}`);
            resolve();
          };
          document.body.appendChild(s);
        });
      }

      const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwhXVb3waX1ZJS0B-NRngCIVOeGuq5ZcBufwZLXaNnXAHl1s-1h0YgC7Mb65mUAEEgaJQ/exec";
      if (typeof initPushNotification === 'function') initPushNotification(GAS_WEBAPP_URL);
      if (typeof loadAirData === 'function') loadAirData(GAS_WEBAPP_URL);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
