<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานคุณภาพอากาศและ EHS ม.มหิดล</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0288D1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AirAlert">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- โหลดสไตล์ชีตแยกตามโมดูล (SoC CSS) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/aqi-view.css">
  <link rel="stylesheet" href="css/light-view.css">

  <!-- ไลบรารีภายนอก -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
</head>
<body>

  <!-- แถบเมนูด้านบนสำหรับ PC / Desktop Navigation -->
  <header class="app-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <div>
          <span class="brand-title">OPPE Sustainability</span>
          <span class="brand-sub">กองกายภาพและสิ่งแวดล้อม มหาวิทยาลัยมหิดล</span>
        </div>
      </div>
      <nav class="nav-tabs">
        <button type="button" class="tab-btn active" data-view="view-air">
          คุณภาพอากาศ
        </button>
        <button type="button" class="tab-btn" data-view="view-light">
          ตรวจวัดแสงสว่าง (ISO)
        </button>
      </nav>
    </div>
  </header>

  <main class="main-wrapper">
    <section id="view-air" class="view-panel active">
      <div id="view-header"></div>
      <div id="view-aqi"></div>
    </section>

    <section id="view-light" class="view-panel">
      <div id="view-light-page"></div>
    </section>
  </main>

  <!-- แถบเมนูด้านล่างสำหรับ Mobile Navigation Bar -->
  <nav class="mobile-nav">
    <button type="button" class="mobile-nav-item active" data-view="view-air">
      <span class="lbl">คุณภาพอากาศ</span>
    </button>
    <button type="button" class="mobile-nav-item" data-view="view-light">
      <span class="lbl">ตรวจวัดแสง (ISO)</span>
    </button>
  </nav>

  <!-- สคริปต์โหลดคอมโพเนนต์และควบคุมการทำงาน -->
  <script>
    async function loadComponent(elementId, filePath) {
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`HTTP ${res.status} on ${filePath}`);
        const html = await res.text();
        const el = document.getElementById(elementId);
        if (el) el.innerHTML = html;
      } catch (e) {
        console.error("Load component error:", e);
      }
    }

    async function initApp() {
      // 1. โหลดคอมโพเนนต์ HTML ให้ครบถ้วนก่อน
      await Promise.all([
        loadComponent('view-header', 'components/header.html'),
        loadComponent('view-aqi', 'components/aqi-summary.html'),
        loadComponent('view-light-page', 'components/light-page.html')
      ]);

      // 2. โหลดไฟล์ JavaScript ลำดับตามโมดูล
      const scripts = [
        'js/carousel.js',
        'js/aqi-chart.js',
        'js/push-notify.js',
        'js/light-data.js'
      ];

      for (const src of scripts) {
        await new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => {
            console.error(`Failed to load script: ${src}`);
            resolve();
          };
          document.body.appendChild(s);
        });
      }

      // 3. เริ่มต้นระบบปัด Carousel ทันทีหลังจาก DOM โครงสร้างพร้อม
      if (typeof window.initCarousel === 'function') {
        window.initCarousel();
      }

      // 4. เริ่มต้นดึงข้อมูลสภาพอากาศและลงทะเบียนระบบแจ้งเตือน
      const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwhXVb3waX1ZJS0B-NRngCIVOeGuq5ZcBufwZLXaNnXAHl1s-1h0YgC7Mb65mUAEEgaJQ/exec";
      if (typeof initPushNotification === 'function') initPushNotification(GAS_WEBAPP_URL);
      if (typeof loadAirData === 'function') loadAirData(GAS_WEBAPP_URL);

      // 5. เปิดใช้งานระบบ Navigation สลับหน้า
      setupNavigation();
    }

    function setupNavigation() {
      const navButtons = document.querySelectorAll('.tab-btn, .mobile-nav-item');
      const panels = document.querySelectorAll('.view-panel');

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const targetViewId = btn.getAttribute('data-view');

          // สลับสถานะปุ่มเมนู
          navButtons.forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-view') === targetViewId);
          });

          // สลับการแสดงหน้า View
          panels.forEach(panel => {
            panel.classList.toggle('active', panel.id === targetViewId);
          });

          // หน่วงเวลาเล็กน้อยเพื่อให้เบราว์เซอร์จัดสเกลความกว้างก่อนวาดกราฟแท่ง
          if (targetViewId === 'view-light' && typeof window.initLightDashboard === 'function') {
            setTimeout(() => {
              window.initLightDashboard();
            }, 100);
          }
        });
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
