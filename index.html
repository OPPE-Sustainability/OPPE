<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OPPE Sustainability Dashboard</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F5A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- โหลดฟอนต์ Plus Jakarta Sans และ JetBrains Mono ตามสเปกดีไซน์ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/aqi-view.css">
  <link rel="stylesheet" href="css/light-view.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
</head>
<body>

  <!-- ปุ่ม FAB เปิดเมนูมุมขวาล่าง -->
  <button id="menuToggle" class="fab-menu" aria-label="เปิดเมนูนำทาง">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="7" x2="20" y2="7"></line>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17" x2="20" y2="17"></line>
    </svg>
  </button>

  <!-- ม่านหลังและ Sidebar Menu Drawer -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside id="sidebarMenu" class="sidebar">
    <div class="sidebar-header">
      <span class="brand-badge">EHS & Sustainability</span>
      <h2>OPPE Portal</h2>
      <p>กองกายภาพและสิ่งแวดล้อม ม.มหิดล</p>
    </div>
    <nav class="sidebar-nav">
      <button class="tab-btn active" data-index="0" data-view="view-air">
        <span class="btn-dot"></span> คุณภาพอากาศและสภาพแวดล้อม
      </button>
      <button class="tab-btn" data-index="1" data-view="view-light">
        <span class="btn-dot"></span> ตรวจวัดแสงสว่าง (ISO 45001)
      </button>
    </nav>
  </aside>

  <!-- พื้นที่สไลด์แนวตั้ง (Vertical Slide Carousel) -->
  <main class="main-viewport">
    <div class="vertical-track" id="verticalTrack">
      
      <!-- View 1: ข้อมูลคุณภาพอากาศ -->
      <section id="view-air" class="view-panel">
        <div class="panel-content">
          <div id="view-header"></div>
          <div id="view-aqi"></div>
        </div>
      </section>

      <!-- View 2: ระบบตรวจวัดแสงสว่าง -->
      <section id="view-light" class="view-panel">
        <div class="panel-content">
          <div id="view-light-page"></div>
        </div>
      </section>

    </div>
  </main>

  <script>
    async function loadComponent(elementId, filePath) {
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`HTTP error on ${filePath}`);
        document.getElementById(elementId).innerHTML = await res.text();
      } catch (e) {
        console.error("Load error:", e);
      }
    }

    async function initApp() {
      await Promise.all([
        loadComponent('view-header', 'components/header.html'),
        loadComponent('view-aqi', 'components/aqi-summary.html'),
        loadComponent('view-light-page', 'components/light-page.html')
      ]);

      const scripts = ['js/carousel.js', 'js/aqi-chart.js', 'js/push-notify.js', 'js/light-data.js'];
      for (const src of scripts) {
        await new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          document.body.appendChild(s);
        });
      }

      if (typeof window.initCarousel === 'function') window.initCarousel();

      const GAS_WEBAPP_URL = "https://script.google.com/a/macros/mahidol.ac.th/s/AKfycbyG1aEjY8weKwDRxyM2Wj_jO8UScw_wD7gcpgcKJzUjdYRykAQEs8VzVExlWqOtTY3NUA/exec";
      if (typeof initPushNotification === 'function') initPushNotification(GAS_WEBAPP_URL);
      if (typeof loadAirData === 'function') loadAirData(GAS_WEBAPP_URL);

      setupVerticalNavigation();
    }

    function setupVerticalNavigation() {
      const navButtons = document.querySelectorAll('.tab-btn');
      const verticalTrack = document.getElementById('verticalTrack');
      const menuToggle = document.getElementById('menuToggle');
      const sidebarMenu = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('sidebarOverlay');

      function toggleMenu() {
        sidebarMenu.classList.toggle('open');
        overlay.classList.toggle('active');
      }

      menuToggle.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const index = btn.getAttribute('data-index');
          const targetViewId = btn.getAttribute('data-view');

          verticalTrack.style.transform = `translateY(-${index * 100}dvh)`;

          navButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          toggleMenu();

          if (targetViewId === 'view-light' && typeof window.initLightDashboard === 'function') {
            setTimeout(() => { window.initLightDashboard(); }, 600);
          }
        });
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
