<!-- components/header.html -->
<div class="topbar-content">
  <div class="topbar-left">
    <div class="mobile-logo-group">
      <img src="icon-192.png" alt="OPPE Logo" class="topbar-logo" onerror="this.style.display='none'">
      <div>
        <h2 class="topbar-title">OPPE-Notifications</h2>
        <span class="topbar-sub">EHS & Sustainability Management Platform</span>
      </div>
    </div>
  </div>

  <div class="topbar-right">
    <div class="network-badge">
      <span class="status-indicator-dot online"></span>
      <span class="network-text">Mahidol Net</span>
    </div>
    <button type="button" class="btn-icon" onclick="window.navigateTo('notifications')" aria-label="Notification Center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
  </div>
</div>
